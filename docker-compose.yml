services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_training_tracker
      POSTGRES_USER: hr_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - hr_training_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_admin -d hr_training_tracker"]
      interval: 10s
      timeout: 5s
      retries: 8

  app:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVER_PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
      DATABASE_URL: postgresql://hr_admin:${POSTGRES_PASSWORD:-change-this-password}@database:5432/hr_training_tracker?schema=public
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Human Resource Digital <training@sugiharagrand.com>}
    ports:
      - "${APP_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  hr_training_data:
